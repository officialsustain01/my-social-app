<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sustain Social</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 10px;
    }

    .post-box, .post {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: none;
    }

    button {
      margin-top: 10px;
      background: #1877f2;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .post-name {
      font-weight: bold;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <header>Sustain Social</header>

  <div class="container">

    <div class="post-box">
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <button onclick="createPost()">Post</button>
    </div>

    <div id="feed"></div>

  </div>

  <script>
    function createPost() {
      const text = document.getElementById("postText").value.trim();

      if (text === "") {
        alert("Please write something first.");
        return;
      }

      const post = document.createElement("div");
      post.className = "post";

      post.innerHTML = `
        <div class="post-name">Official Sustain</div>
        <div>${text}</div>
      `;

      document.getElementById("feed").prepend(post);
      document.getElementById("postText").value = "";
    }
  </script>

</body>
</html>
